name: Link Check

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.es.md"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "README.md"
      - "README.es.md"
      - ".github/workflows/link-check.yml"
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --cache
            --max-cache-age 1d
            --max-retries 2
            --timeout 20
            --exclude "img.shields.io"
            --exclude "mirrors.creativecommons.org"
            --exclude "github.com/Pautthead/awesome-design-stack"
            --exclude "github.com/fluyeporlaweb/awesome-design-stack"
            --exclude "www.canva.com"
            --exclude "www.figma.com"
            --exclude "webdesign.tutsplus.com"
            './README.md'
            './README.es.md'

      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links detected in READMEs"
          content-filepath: ./lychee/out.md
          labels: |
            broken-links
